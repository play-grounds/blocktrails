<body>
  <div class="v-top"><a href="./">&larr; Blocktrails</a></div>
  <div class="v-wrap" id="app"></div>
  <script type="module">
import { parseTxoUri, isValidTxoUri } from 'https://esm.sh/txo_parser'
import { secp256k1, schnorr } from 'https://esm.sh/@noble/curves@1.8.1/secp256k1'
import qrcodegen from 'https://esm.sh/qrcode-generator@1.4.4'

// ── Crypto helpers ──────────────────────────────────────

const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'

function b58decode(str) {
  const bytes = []
  for (const c of str) {
    let carry = B58.indexOf(c)
    if (carry < 0) throw new Error('Invalid base58 character: ' + c)
    for (let j = 0; j < bytes.length; j++) {
      carry += bytes[j] * 58
      bytes[j] = carry & 0xff
      carry >>= 8
    }
    while (carry > 0) { bytes.push(carry & 0xff); carry >>= 8 }
  }
  for (const c of str) { if (c === '1') bytes.push(0); else break }
  return new Uint8Array(bytes.reverse())
}

async function sha256(data) {
  const buf = data instanceof Uint8Array ? data : new TextEncoder().encode(data)
  return new Uint8Array(await crypto.subtle.digest('SHA-256', buf))
}

async function doubleSha256(data) {
  return sha256(await sha256(data))
}

async function wifDecode(wif) {
  const raw = b58decode(wif)
  if (raw.length < 5) throw new Error('WIF too short')
  const payload = raw.slice(0, -4)
  const checksum = raw.slice(-4)
  const hash = await doubleSha256(payload)
  for (let i = 0; i < 4; i++) {
    if (hash[i] !== checksum[i]) throw new Error('Invalid WIF checksum')
  }
  const version = payload[0]
  const isTestnet = version === 0xef
  const isMainnet = version === 0x80
  if (!isTestnet && !isMainnet) throw new Error('Unknown WIF version: 0x' + version.toString(16))
  const compressed = payload.length === 34 && payload[33] === 0x01
  return { privkey: payload.slice(1, 33), compressed, testnet: isTestnet }
}

function hexToBytes(hex) {
  if (hex.length !== 64 || !/^[0-9a-fA-F]{64}$/.test(hex)) throw new Error('Invalid 64-char hex key')
  const bytes = new Uint8Array(32)
  for (let i = 0; i < 32; i++) bytes[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16)
  return bytes
}

function isHexKey(s) {
  return s.length === 64 && /^[0-9a-fA-F]{64}$/.test(s)
}

async function decodeKey(input) {
  if (isHexKey(input)) return { privkey: hexToBytes(input), compressed: true, testnet: true }
  return wifDecode(input)
}

function privkeyToXOnly(privkeyBytes) {
  return secp256k1.getPublicKey(privkeyBytes, true).slice(1)
}

// ── Bech32/Bech32m ──────────────────────────────────────

const BECH32_CHARSET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l'
const BECH32M_CONST = 0x2bc830a3
const BECH32_CONST = 1

function polymod(values) {
  const GEN = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3]
  let chk = 1
  for (const v of values) {
    const b = chk >> 25
    chk = ((chk & 0x1ffffff) << 5) ^ v
    for (let i = 0; i < 5; i++) if ((b >> i) & 1) chk ^= GEN[i]
  }
  return chk
}

function hrpExpand(hrp) {
  const r = []
  for (const c of hrp) r.push(c.charCodeAt(0) >> 5)
  r.push(0)
  for (const c of hrp) r.push(c.charCodeAt(0) & 31)
  return r
}

function convertBits(data, from, to, pad) {
  let acc = 0, bits = 0
  const ret = [], maxv = (1 << to) - 1
  for (const v of data) {
    acc = (acc << from) | v
    bits += from
    while (bits >= to) { bits -= to; ret.push((acc >> bits) & maxv) }
  }
  if (pad && bits > 0) ret.push((acc << (to - bits)) & maxv)
  return ret
}

function bech32mEncode(hrp, version, program) {
  const conv = convertBits(program, 8, 5, true)
  const values = [version, ...conv]
  const enc = [...hrpExpand(hrp), ...values, 0, 0, 0, 0, 0, 0]
  const mod = polymod(enc) ^ BECH32M_CONST
  const checksum = [0,1,2,3,4,5].map(i => (mod >> (5 * (5 - i))) & 31)
  let result = hrp + '1'
  for (const v of [...values, ...checksum]) result += BECH32_CHARSET[v]
  return result
}

function bech32Decode(str) {
  str = str.toLowerCase()
  const pos = str.lastIndexOf('1')
  if (pos < 1) throw new Error('Invalid bech32 address')
  const hrp = str.slice(0, pos)
  const data = []
  for (let i = pos + 1; i < str.length; i++) {
    const idx = BECH32_CHARSET.indexOf(str[i])
    if (idx < 0) throw new Error('Invalid character in address')
    data.push(idx)
  }
  const enc = [...hrpExpand(hrp), ...data]
  const mod = polymod(enc)
  const values = data.slice(0, -6)
  const version = values[0]
  const expected = version === 0 ? BECH32_CONST : BECH32M_CONST
  if (mod !== expected) throw new Error('Invalid address checksum')
  const program = new Uint8Array(convertBits(values.slice(1), 5, 8, false))
  return { hrp, version, program }
}

function addressToScript(addr) {
  const { version, program } = bech32Decode(addr)
  if (version === 1 && program.length === 32) return concatBytes(new Uint8Array([0x51, 0x20]), program)
  if (version === 0 && program.length === 20) return concatBytes(new Uint8Array([0x00, 0x14]), program)
  if (version === 0 && program.length === 32) return concatBytes(new Uint8Array([0x00, 0x20]), program)
  throw new Error('Unsupported address type')
}

function privkeyToAddress(privkeyBytes, testnet = true) {
  const xonly = privkeyToXOnly(privkeyBytes)
  return bech32mEncode(testnet ? 'tb' : 'bc', 1, xonly)
}

// ── Byte helpers ─────────────────────────────────────────

function bytesToHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('')
}

function hexToU8(hex) {
  const bytes = new Uint8Array(hex.length / 2)
  for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16)
  return bytes
}

function concatBytes(...arrays) {
  const total = arrays.reduce((s, a) => s + a.length, 0)
  const result = new Uint8Array(total)
  let off = 0
  for (const a of arrays) { result.set(a, off); off += a.length }
  return result
}

// ── Tagged hash (BIP340/341) ─────────────────────────────

async function taggedHash(tag, ...msgs) {
  const tagHash = await sha256(new TextEncoder().encode(tag))
  return sha256(concatBytes(tagHash, tagHash, ...msgs))
}

// ── Taproot key tweaking (BIP86) ─────────────────────────

const SECP_N = BigInt('0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141')

function bytesToBigInt(bytes) {
  let r = 0n
  for (const b of bytes) r = (r << 8n) | BigInt(b)
  return r
}

function bigIntToBytes(n) {
  return hexToU8(n.toString(16).padStart(64, '0'))
}

async function getTweakedKeys(privkeyBytes) {
  const xonly = privkeyToXOnly(privkeyBytes)
  const tweak = await taggedHash('TapTweak', xonly)
  const t = bytesToBigInt(tweak)
  let d = bytesToBigInt(privkeyBytes)
  const fullPub = secp256k1.getPublicKey(privkeyBytes, false)
  if (fullPub[64] & 1) d = SECP_N - d
  const tweakedD = (d + t) % SECP_N
  const tweakedPriv = bigIntToBytes(tweakedD)
  const tweakedXOnly = schnorr.getPublicKey(tweakedPriv)
  return { tweakedPriv, tweakedXOnly, internalXOnly: xonly }
}

function p2trScript(xonlyPubkey) {
  return concatBytes(new Uint8Array([0x51, 0x20]), xonlyPubkey)
}

// ── Transaction serialization ────────────────────────────

function writeU32LE(val) {
  const b = new Uint8Array(4)
  b[0] = val & 0xff; b[1] = (val >> 8) & 0xff; b[2] = (val >> 16) & 0xff; b[3] = (val >> 24) & 0xff
  return b
}

function writeU64LE(val) {
  const b = new Uint8Array(8)
  const n = BigInt(val)
  for (let i = 0; i < 8; i++) b[i] = Number((n >> BigInt(i * 8)) & 0xffn)
  return b
}

function writeVarInt(val) {
  if (val < 0xfd) return new Uint8Array([val])
  if (val <= 0xffff) return new Uint8Array([0xfd, val & 0xff, (val >> 8) & 0xff])
  throw new Error('VarInt too large')
}

function reverseTxid(txidHex) {
  const bytes = hexToU8(txidHex)
  bytes.reverse()
  return bytes
}

function estimateVsize(numInputs, numOutputs) {
  return Math.ceil((42 + 230 * numInputs + 172 * numOutputs) / 4)
}

// ── Build & sign taproot transaction ─────────────────────

async function buildTransaction(inputs, outputs, privkey) {
  const internalXOnly = privkeyToXOnly(privkey)
  const { tweakedPriv } = await getTweakedKeys(privkey)
  const untweakedHex = '5120' + bytesToHex(internalXOnly)
  const signingKey = bytesToHex(inputs[0].scriptPubKey) === untweakedHex ? privkey : tweakedPriv

  const version = 2, locktime = 0, sequence = 0xfffffffd

  const serOutputs = outputs.map(o =>
    concatBytes(writeU64LE(o.amount), writeVarInt(o.scriptPubKey.length), o.scriptPubKey)
  )

  const shaPrevouts = await sha256(concatBytes(...inputs.map(i =>
    concatBytes(reverseTxid(i.txid), writeU32LE(i.vout))
  )))
  const shaAmounts = await sha256(concatBytes(...inputs.map(i => writeU64LE(i.amount))))
  const shaScriptPubKeys = await sha256(concatBytes(...inputs.map(i =>
    concatBytes(writeVarInt(i.scriptPubKey.length), i.scriptPubKey)
  )))
  const shaSequences = await sha256(concatBytes(...inputs.map(() => writeU32LE(sequence))))
  const shaOutputs = await sha256(concatBytes(...serOutputs))

  const sigs = []
  for (let i = 0; i < inputs.length; i++) {
    const sigMsg = concatBytes(
      new Uint8Array([0x00, 0x00]),
      writeU32LE(version), writeU32LE(locktime),
      shaPrevouts, shaAmounts, shaScriptPubKeys, shaSequences, shaOutputs,
      new Uint8Array([0x00]),
      writeU32LE(i)
    )
    const sighash = await taggedHash('TapSighash', sigMsg)
    sigs.push(schnorr.sign(sighash, signingKey))
  }

  const parts = [
    writeU32LE(version),
    new Uint8Array([0x00, 0x01]),
    writeVarInt(inputs.length)
  ]
  for (const inp of inputs) {
    parts.push(reverseTxid(inp.txid), writeU32LE(inp.vout), new Uint8Array([0x00]), writeU32LE(sequence))
  }
  parts.push(writeVarInt(outputs.length))
  for (const so of serOutputs) parts.push(so)
  for (const sig of sigs) {
    parts.push(new Uint8Array([0x01]), writeVarInt(sig.length), sig)
  }
  parts.push(writeU32LE(locktime))
  return bytesToHex(concatBytes(...parts))
}

// ── OP_RETURN ───────────────────────────────────────────

function opReturnScript(data) {
  if (data.length > 80) throw new Error('OP_RETURN data exceeds 80 bytes')
  if (data.length <= 75) return new Uint8Array([0x6a, data.length, ...data])
  return new Uint8Array([0x6a, 0x4c, data.length, ...data])
}

// ── Mempool API ─────────────────────────────────────────

const MEMPOOL = 'https://mempool.space/testnet4/api'

async function fetchUtxos(address) {
  const res = await fetch(`${MEMPOOL}/address/${address}/utxo`)
  if (!res.ok) throw new Error('Mempool API error: ' + res.status)
  return res.json()
}

async function fetchTxDetails(txid) {
  const res = await fetch(`${MEMPOOL}/tx/${txid}`)
  if (!res.ok) throw new Error('Failed to fetch tx: ' + res.status)
  return res.json()
}

async function broadcastTx(rawTxHex) {
  const res = await fetch(`${MEMPOOL}/tx`, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: rawTxHex
  })
  if (!res.ok) throw new Error(await res.text())
  return res.text()
}

async function fetchFeeRates() {
  try {
    const res = await fetch(`${MEMPOOL}/v1/fees/recommended`)
    if (!res.ok) return { economy: 1, normal: 2, priority: 4 }
    const d = await res.json()
    return {
      economy: d.economyFee || d.hourFee || 1,
      normal: d.halfHourFee || d.fastestFee || 2,
      priority: d.fastestFee || 4
    }
  } catch { return { economy: 1, normal: 2, priority: 4 } }
}

// ── Helpers ─────────────────────────────────────────────

function truncate(s, start = 8, end = 6) {
  if (!s || s.length <= start + end + 3) return s
  return s.slice(0, start) + '...' + s.slice(-end)
}

function satsBtc(sats) { return (sats / 1e8).toFixed(8) }

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
}

function toast(msg) {
  const t = document.createElement('div')
  t.className = 'v-toast'
  t.textContent = msg
  document.body.appendChild(t)
  setTimeout(() => t.remove(), 2500)
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('Copied'))
}

function totalBalance() {
  return utxos.reduce((s, u) => s + (u.value || 0), 0)
}

function confirmedCount() {
  return utxos.filter(u => u.status?.confirmed).length

// ── QR code ─────────────────────────────────────────────

function generateQR(text) {
  try {
    const qr = qrcodegen(0, 'M')
    qr.addData(text)
    qr.make()
    const size = qr.getModuleCount()
    const cell = 5
    const margin = 2
    const total = size * cell + margin * 2 * cell
    let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${total}" height="${total}" viewBox="0 0 ${total} ${total}">`
    svg += `<rect width="${total}" height="${total}" fill="#fff" rx="4"/>`
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (qr.isDark(r, c)) {
          svg += `<rect x="${(c + margin) * cell}" y="${(r + margin) * cell}" width="${cell}" height="${cell}" fill="#1e1b4b"/>`
        }
      }
    }
    svg += '</svg>'
    return svg
  } catch (e) {
    console.warn('QR generation failed:', e)
    return ''
  }
}

// ── Key management ──────────────────────────────────────

async function importWalletKey(input) {
  input = input.trim()
  if (!input) return

  // Handle TXO URI — extract key
  if (input.startsWith('txo:') || isValidTxoUri(input)) {
    try {
      const parsed = parseTxoUri(input)
      if (parsed.privkey) input = parsed.privkey
      else throw new Error('TXO URI has no privkey')
    } catch (e) {
      toast('Could not extract key: ' + e.message)
      return
    }
  }

  try {
    const decoded = await decodeKey(input)
    privkey = decoded.privkey
    address = privkeyToAddress(decoded.privkey, decoded.testnet)
    // Store as hex for nostr compatibility
    localStorage.setItem('nostr:privkey', bytesToHex(privkey))
    toast('Key imported')
    await refreshUtxos()
    render()
  } catch (e) {
    toast('Import failed: ' + e.message)
  }
}

function clearWallet() {
  if (!confirm('Clear wallet? This removes the key from this browser.')) return
  privkey = null
  address = ''
  utxos = []
  lastTxid = ''
  localStorage.removeItem('nostr:privkey')
  localStorage.removeItem(LS_KEY)
  render()
}

// ── UTXO management ─────────────────────────────────────

async function refreshUtxos() {
  if (!address) return
  refreshing = true
  render()
  try {
    utxos = await fetchUtxos(address)
    saveToStorage()
    feeRates = await fetchFeeRates()
  } catch (e) {
    toast('Refresh failed: ' + e.message)
  }
  refreshing = false
  render()
}

// ── Send transaction ────────────────────────────────────

async function doSend() {
  const toAddr = document.getElementById('w-send-addr')?.value.trim()
  const amtStr = document.getElementById('w-send-amount')?.value.trim()
  const opData = document.getElementById('w-send-opreturn')?.value || ''

  if (!toAddr) { toast('Enter destination address'); return }
  if (!amtStr) { toast('Enter amount'); return }

  let destScript
  try { destScript = addressToScript(toAddr) }
  catch (e) { toast('Invalid address: ' + e.message); return }

  const amountSats = parseInt(amtStr)
  if (isNaN(amountSats) || amountSats <= 0) { toast('Invalid amount'); return }

  const feeRate = feeRates[selectedFee] || 2

  // Parse OP_RETURN data
  let opReturnData = null
  if (opData.length > 0) {
    if (opReturnMode === 'hex') {
      const clean = opData.replace(/\s/g, '')
      if (!/^[0-9a-fA-F]*$/.test(clean) || clean.length % 2 !== 0) { toast('Invalid hex data'); return }
      opReturnData = hexToU8(clean)
    } else {
      opReturnData = new TextEncoder().encode(opData)
    }
    if (opReturnData.length > 80) { toast('OP_RETURN exceeds 80 bytes'); return }
  }

  // Build outputs
  const outputs = [{ amount: amountSats, scriptPubKey: destScript }]
  if (opReturnData && opReturnData.length > 0) {
    outputs.push({ amount: 0, scriptPubKey: opReturnScript(opReturnData) })
  }

  // Coin selection (largest-first)
  const sorted = [...utxos].sort((a, b) => b.value - a.value)
  const selected = []
  let totalIn = 0

  for (const u of sorted) {
    selected.push(u)
    totalIn += u.value
    const numOut = outputs.length + 1 // potential change
    const vsize = estimateVsize(selected.length, numOut)
    const fee = Math.ceil(vsize * feeRate)
    if (totalIn >= amountSats + fee) break
  }

  const numOut = outputs.length + 1
  const vsize = estimateVsize(selected.length, numOut)
  const fee = Math.ceil(vsize * feeRate)

  if (totalIn < amountSats + fee) { toast('Insufficient funds'); return }

  const change = totalIn - amountSats - fee
  if (change > 546) {
    outputs.push({ amount: change, scriptPubKey: p2trScript(privkeyToXOnly(privkey)) })
  }

  // Recalculate fee with actual output count
  const actualVsize = estimateVsize(selected.length, outputs.length)
  const actualFee = Math.ceil(actualVsize * feeRate)

  const msg = `Send ${amountSats.toLocaleString()} sats to ${truncate(toAddr)}?\n\n` +
    `Inputs: ${selected.length} UTXO${selected.length > 1 ? 's' : ''} (${totalIn.toLocaleString()} sats)\n` +
    `Fee: ${actualFee} sats (${feeRate} sat/vB)\n` +
    (change > 546 ? `Change: ${change.toLocaleString()} sats\n` : '') +
    (opReturnData ? `OP_RETURN: ${opReturnData.length} bytes\n` : '')

  if (!confirm(msg)) return

  sending = true
  render()

  try {
    // Fetch scriptPubKeys for selected UTXOs
    const txInputs = []
    for (const u of selected) {
      const txDet = await fetchTxDetails(u.txid)
      const prevOut = txDet.vout[u.vout]
      txInputs.push({
        txid: u.txid,
        vout: u.vout,
        amount: u.value,
        scriptPubKey: hexToU8(prevOut.scriptpubkey)
      })
    }

    const rawTx = await buildTransaction(txInputs, outputs, privkey)
    const txid = await broadcastTx(rawTx)
    lastTxid = txid
    toast('Sent! ' + truncate(txid))

    // Refresh UTXOs after a short delay
    setTimeout(() => refreshUtxos(), 2000)
  } catch (e) {
    toast('Send failed: ' + e.message)
    console.error(e)
  }

  sending = false
  render()
}

// ── Event binding ───────────────────────────────────────

function bindImport() {
  const btn = document.getElementById('w-import-btn')
  const inp = document.getElementById('w-import-input')
  if (btn) btn.onclick = () => importWalletKey(inp?.value || '')
  if (inp) inp.onkeydown = e => { if (e.key === 'Enter') btn?.click() }
}

function bindEvents() {
  // Tab switching
  document.querySelectorAll('.w-tab').forEach(tab => {
    tab.onclick = () => { activeTab = tab.dataset.tab; render() }
  })

  // Header buttons
  const refreshBtn = document.getElementById('w-refresh-btn')
  if (refreshBtn) refreshBtn.onclick = () => refreshUtxos()
  const clearBtn = document.getElementById('w-clear-btn')
  if (clearBtn) clearBtn.onclick = clearWallet

  // Import (if no key)
  bindImport()

  // Fee selection
  document.querySelectorAll('.w-fee-opt').forEach(opt => {
    opt.onclick = () => { selectedFee = opt.dataset.fee; render() }
  })

  // OP_RETURN mode toggle
  document.querySelectorAll('.w-toggle-opt').forEach(opt => {
    opt.onclick = () => { opReturnMode = opt.dataset.opmode; render() }
  })

  // OP_RETURN byte counter
  const opInput = document.getElementById('w-send-opreturn')
  const opCount = document.getElementById('w-opreturn-count')
  if (opInput && opCount) {
    opInput.oninput = () => {
      let len
      if (opReturnMode === 'hex') {
        len = Math.floor(opInput.value.replace(/\s/g, '').length / 2)
      } else {
        len = new TextEncoder().encode(opInput.value).length
      }
      opCount.textContent = `${len} / 80 bytes`
      opCount.style.color = len > 80 ? '#ef4444' : 'rgba(255,255,255,0.25)'
    }
  }

  // Max button
  const maxBtn = document.getElementById('w-max-btn')
  if (maxBtn) {
    maxBtn.onclick = () => {
      const feeRate = feeRates[selectedFee] || 2
      const vsize = estimateVsize(utxos.length || 1, 1) // all inputs, 1 output (no change)
      const fee = Math.ceil(vsize * feeRate)
      const max = totalBalance() - fee
      const inp = document.getElementById('w-send-amount')
      if (inp && max > 0) inp.value = max
    }
  }

  // Send button
  const sendBtn = document.getElementById('w-send-btn')
  if (sendBtn) sendBtn.onclick = doSend

  // Copy address
  const copyAddr = document.getElementById('w-copy-addr')
  if (copyAddr) copyAddr.onclick = () => copyText(address)

  // Click-to-copy on various elements
  document.querySelectorAll('[data-copy]').forEach(el => {
    el.onclick = () => copyText(el.dataset.copy)
    el.style.cursor = 'pointer'
  })
}

// ── Init ────────────────────────────────────────────────

async function init() {
  // Try loading key from localStorage
  const stored = localStorage.getItem('nostr:privkey')
  if (stored && isHexKey(stored)) {
    try {
      privkey = hexToBytes(stored)
      address = privkeyToAddress(privkey, true)
    } catch (e) {
      console.warn('Failed to load stored key:', e)
    }
  }

  render()

  if (privkey) {
    await refreshUtxos()
  }
}

init()
  </script>
</body>
