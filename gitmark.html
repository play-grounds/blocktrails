<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gitmark</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      color: rgba(255,255,255,0.9);
      min-height: 100vh;
    }
    .v-top { padding: 10px 16px; }

    .v-wrap { max-width: 900px; margin: 0 auto; padding: 0 16px 40px; }
    .v-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .v-title { font-size: 1.5em; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .v-net { font-size: 0.6em; padding: 4px 10px; border-radius: 6px; background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.3); color: #fbbf24; font-weight: 600; letter-spacing: 0.04em; }

    .v-hero { text-align: center; padding: 32px 0 28px; }

    .v-hero-sats { font-size: 2.8rem; font-weight: 800; letter-spacing: -0.02em; }
    .v-hero-btc { font-size: 0.95rem; color: rgba(255,255,255,0.35); margin-top: 2px; }

    .v-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 24px; margin-bottom: 20px; backdrop-filter: blur(12px); }

    .v-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .v-stat { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 14px; text-align: center; }

    .v-badge-unspent { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #10b981; }

    .v-badge-unknown { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.35); }

    .v-masked::after { content: ' (click)'; font-size: 0.8em; color: rgba(255,255,255,0.2); }

    .v-empty { text-align: center; padding: 32px; color: rgba(255,255,255,0.25); font-style: italic; }

    /* Toast */

    .gm-commits { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 5px; font-size: 0.68rem; font-weight: 600; background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.3); color: #a78bfa; }
    .gm-commit-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; cursor: pointer; transition: background 0.15s; border: 1px solid transparent; margin-bottom: 4px; }
    .gm-commit-item:hover { background: rgba(255,255,255,0.04); }
    .gm-commit-item.selected { border-color: rgba(16,185,129,0.4); background: rgba(16,185,129,0.06); }
    .gm-commit-hash { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.78rem; color: rgba(245,158,11,0.8); flex-shrink: 0; }
    .gm-commit-msg { font-size: 0.78rem; color: rgba(255,255,255,0.6); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gm-commit-date { font-size: 0.68rem; color: rgba(255,255,255,0.25); flex-shrink: 0; }

    .bt-chain { padding: 0; margin: 8px 0 0; list-style: none; }

    .bt-step:last-child { border-bottom: none; }
    .bt-step-num { min-width: 24px; height: 24px; border-radius: 50%; background: rgba(124,58,237,0.2); border: 1px solid rgba(124,58,237,0.4); color: #a78bfa; font-size: 0.7rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .bt-step-current .bt-step-num { background: rgba(16,185,129,0.2); border-color: rgba(16,185,129,0.4); color: #10b981; }
    .bt-step-info { flex: 1; min-width: 0; }
    .bt-step-state { font-weight: 600; color: rgba(255,255,255,0.8); word-break: break-all; }
    .bt-step-addr { font-family: 'SF Mono', monospace; font-size: 0.75rem; color: rgba(255,255,255,0.35); word-break: break-all; cursor: pointer; }
    .bt-step-addr:hover { color: rgba(255,255,255,0.7); }

    @media (max-width: 600px) {
      .v-stats { grid-template-columns: 1fr; }
      .v-hero-sats { font-size: 2rem; }
      .v-import-row { flex-direction: column; }
    }

<body>
  <div class="v-top"><a href="./">&larr; Blocktrails</a></div>
  <div class="v-wrap" id="app"></div>
  <script type="module">
import { parseTxoUri, isValidTxoUri, formatTxoUri } from 'https://esm.sh/txo_parser'
import { secp256k1, schnorr } from 'https://esm.sh/@noble/curves@1.8.1/secp256k1'

// ── Crypto helpers ──────────────────────────────────────

const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz'

function b58decode(str) {
  const bytes = []
  for (const c of str) {
    let carry = B58.indexOf(c)
    if (carry < 0) throw new Error('Invalid base58 character: ' + c)
    for (let j = 0; j < bytes.length; j++) {
      carry += bytes[j] * 58
      bytes[j] = carry & 0xff
      carry >>= 8
    }
    while (carry > 0) { bytes.push(carry & 0xff); carry >>= 8 }
  }
  for (const c of str) { if (c === '1') bytes.push(0); else break }
  return new Uint8Array(bytes.reverse())
}

async function sha256(data) {
  const buf = data instanceof Uint8Array ? data : new TextEncoder().encode(data)
  return new Uint8Array(await crypto.subtle.digest('SHA-256', buf))
}

async function doubleSha256(data) {
  return sha256(await sha256(data))
}

async function wifDecode(wif) {
  const raw = b58decode(wif)
  if (raw.length < 5) throw new Error('WIF too short')
  const payload = raw.slice(0, -4)
  const checksum = raw.slice(-4)
  const hash = await doubleSha256(payload)
  for (let i = 0; i < 4; i++) {
    if (hash[i] !== checksum[i]) throw new Error('Invalid WIF checksum')
  }
  const version = payload[0]
  const isTestnet = version === 0xef
  const isMainnet = version === 0x80
  if (!isTestnet && !isMainnet) throw new Error('Unknown WIF version: 0x' + version.toString(16))
  const compressed = payload.length === 34 && payload[33] === 0x01
  return { privkey: payload.slice(1, 33), compressed, testnet: isTestnet }
}

function hexToBytes(hex) {
  if (hex.length !== 64 || !/^[0-9a-fA-F]{64}$/.test(hex)) throw new Error('Invalid 64-char hex key')
  const bytes = new Uint8Array(32)
  for (let i = 0; i < 32; i++) bytes[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16)
  return bytes
}

function isHexKey(s) {
  return s.length === 64 && /^[0-9a-fA-F]{64}$/.test(s)
}

function isCommitHash(s) {
  return /^[0-9a-fA-F]{40}$/.test(s)
}

async function decodeKey(input) {
  if (isHexKey(input)) {
    return { privkey: hexToBytes(input), compressed: true, testnet: true }
  }
  return wifDecode(input)
}

function privkeyToXOnly(privkeyBytes) {
  const pub = secp256k1.getPublicKey(privkeyBytes, true)
  return pub.slice(1)
}

// ── Bech32m ─────────────────────────────────────────────

const BECH32_CHARSET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l'
const BECH32M = 0x2bc830a3

function polymod(values) {
  const GEN = [0x3b6a57b2, 0x26508e6d, 0x1ea119fa, 0x3d4233dd, 0x2a1462b3]
  let chk = 1
  for (const v of values) {
    const b = chk >> 25
    chk = ((chk & 0x1ffffff) << 5) ^ v
    for (let i = 0; i < 5; i++) if ((b >> i) & 1) chk ^= GEN[i]
  }
  return chk
}

function hrpExpand(hrp) {
  const r = []
  for (const c of hrp) r.push(c.charCodeAt(0) >> 5)
  r.push(0)
  for (const c of hrp) r.push(c.charCodeAt(0) & 31)
  return r
}

function convertBits(data, from, to, pad) {
  let acc = 0, bits = 0
  const ret = [], maxv = (1 << to) - 1
  for (const v of data) {
    acc = (acc << from) | v
    bits += from
    while (bits >= to) { bits -= to; ret.push((acc >> bits) & maxv) }
  }
  if (pad && bits > 0) ret.push((acc << (to - bits)) & maxv)
  return ret
}

function bech32mEncode(hrp, version, program) {
  const conv = convertBits(program, 8, 5, true)
  const values = [version, ...conv]
  const enc = [...hrpExpand(hrp), ...values, 0, 0, 0, 0, 0, 0]
  const mod = polymod(enc) ^ BECH32M
  const checksum = [0,1,2,3,4,5].map(i => (mod >> (5 * (5 - i))) & 31)
  let result = hrp + '1'
  for (const v of [...values, ...checksum]) result += BECH32_CHARSET[v]
  return result
}

function privkeyToAddress(privkeyBytes, testnet = true) {
  const xonly = privkeyToXOnly(privkeyBytes)
  return bech32mEncode(testnet ? 'tb' : 'bc', 1, xonly)
}

// ── Byte helpers ─────────────────────────────────────────

function bytesToHex(bytes) {
  return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('')
}

function hexToU8(hex) {
  const bytes = new Uint8Array(hex.length / 2)
  for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16)
  return bytes
}

function concatBytes(...arrays) {
  const total = arrays.reduce((s, a) => s + a.length, 0)
  const result = new Uint8Array(total)
  let off = 0
  for (const a of arrays) { result.set(a, off); off += a.length }
  return result
}

// ── Tagged hash (BIP340/341) ─────────────────────────────

async function taggedHash(tag, ...msgs) {
  const tagHash = await sha256(new TextEncoder().encode(tag))
  return sha256(concatBytes(tagHash, tagHash, ...msgs))
}

// ── Taproot key tweaking (BIP86) ─────────────────────────

const SECP_N = BigInt('0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141')

function bytesToBigInt(bytes) {
  let r = 0n
  for (const b of bytes) r = (r << 8n) | BigInt(b)
  return r
}

function bigIntToBytes(n) {
  const hex = n.toString(16).padStart(64, '0')
  return hexToU8(hex)
}

async function getTweakedKeys(privkeyBytes) {
  const xonly = privkeyToXOnly(privkeyBytes)
  const tweak = await taggedHash('TapTweak', xonly)
  const t = bytesToBigInt(tweak)
  let d = bytesToBigInt(privkeyBytes)
  const fullPub = secp256k1.getPublicKey(privkeyBytes, false)
  if (fullPub[64] & 1) d = SECP_N - d
  const tweakedD = (d + t) % SECP_N
  const tweakedPriv = bigIntToBytes(tweakedD)
  const tweakedXOnly = schnorr.getPublicKey(tweakedPriv)
  return { tweakedPriv, tweakedXOnly, internalXOnly: xonly }
}

function p2trScript(xonlyPubkey) {
  return concatBytes(new Uint8Array([0x51, 0x20]), xonlyPubkey)
}

// ── Transaction serialization ────────────────────────────

function writeU32LE(val) {
  const b = new Uint8Array(4)
  b[0] = val & 0xff; b[1] = (val >> 8) & 0xff; b[2] = (val >> 16) & 0xff; b[3] = (val >> 24) & 0xff
  return b
}

function writeU64LE(val) {
  const b = new Uint8Array(8)
  const n = BigInt(val)
  for (let i = 0; i < 8; i++) b[i] = Number((n >> BigInt(i * 8)) & 0xffn)
  return b
}

function writeVarInt(val) {
  if (val < 0xfd) return new Uint8Array([val])
  if (val <= 0xffff) return new Uint8Array([0xfd, val & 0xff, (val >> 8) & 0xff])
  throw new Error('VarInt too large')
}

function reverseTxid(txidHex) {
  const bytes = hexToU8(txidHex)
  bytes.reverse()
  return bytes
}

function estimateVsize(numInputs, numOutputs) {
  return Math.ceil((42 + 230 * numInputs + 172 * numOutputs) / 4)
}

async function buildTransaction(inputs, outputs, privkeyBytes) {
  const internalXOnly = privkeyToXOnly(privkeyBytes)
  const { tweakedPriv } = await getTweakedKeys(privkeyBytes)
  const untweakedHex = '5120' + bytesToHex(internalXOnly)
  const signingKey = bytesToHex(inputs[0].scriptPubKey) === untweakedHex ? privkeyBytes : tweakedPriv

  const version = 2, locktime = 0, sequence = 0xfffffffd

  const serOutputs = outputs.map(o =>
    concatBytes(writeU64LE(o.amount), writeVarInt(o.scriptPubKey.length), o.scriptPubKey)
  )

  const shaPrevouts = await sha256(concatBytes(...inputs.map(i =>
    concatBytes(reverseTxid(i.txid), writeU32LE(i.vout))
  )))
  const shaAmounts = await sha256(concatBytes(...inputs.map(i => writeU64LE(i.amount))))
  const shaScriptPubKeys = await sha256(concatBytes(...inputs.map(i =>
    concatBytes(writeVarInt(i.scriptPubKey.length), i.scriptPubKey)
  )))
  const shaSequences = await sha256(concatBytes(...inputs.map(() => writeU32LE(sequence))))
  const shaOutputs = await sha256(concatBytes(...serOutputs))

  const sigs = []
  for (let i = 0; i < inputs.length; i++) {
    const sigMsg = concatBytes(
      new Uint8Array([0x00, 0x00]),
      writeU32LE(version), writeU32LE(locktime),
      shaPrevouts, shaAmounts, shaScriptPubKeys, shaSequences, shaOutputs,
      new Uint8Array([0x00]),
      writeU32LE(i)
    )
    const sighash = await taggedHash('TapSighash', sigMsg)
    sigs.push(schnorr.sign(sighash, signingKey))
  }

  const parts = [
    writeU32LE(version),
    new Uint8Array([0x00, 0x01]),
    writeVarInt(inputs.length)
  ]
  for (const inp of inputs) {
    parts.push(reverseTxid(inp.txid), writeU32LE(inp.vout), new Uint8Array([0x00]), writeU32LE(sequence))
  }
  parts.push(writeVarInt(outputs.length))
  for (const so of serOutputs) parts.push(so)
  for (const sig of sigs) {
    parts.push(new Uint8Array([0x01]), writeVarInt(sig.length), sig)
  }
  parts.push(writeU32LE(locktime))
  return bytesToHex(concatBytes(...parts))
}

// ── Mempool API ─────────────────────────────────────────

const MEMPOOL = 'https://mempool.space/testnet4/api'

async function fetchUtxos(address) {
  const res = await fetch(`${MEMPOOL}/address/${address}/utxo`)
  if (!res.ok) throw new Error('Mempool API error: ' + res.status)
  return res.json()
}

async function checkOutspend(txid, vout) {
  try {
    const res = await fetch(`${MEMPOOL}/tx/${txid}/outspend/${vout}`)
    if (!res.ok) return null
    return res.json()
  } catch { return null }
}

async function fetchTxDetails(txid) {
  const res = await fetch(`${MEMPOOL}/tx/${txid}`)
  if (!res.ok) throw new Error('Failed to fetch tx: ' + res.status)
  return res.json()
}

async function broadcastTx(rawTxHex) {
  const res = await fetch(`${MEMPOOL}/tx`, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: rawTxHex
  })
  if (!res.ok) {
    const err = await res.text()
    throw new Error(err)
  }
  return res.text()
}

async function getFeeRate() {
  try {
    const res = await fetch(`${MEMPOOL}/v1/fees/recommended`)
    if (!res.ok) return 2
    const data = await res.json()
    return data.fastestFee || data.halfHourFee || 2
  } catch { return 2 }
}

// ── Storage (localStorage only) ─────────────────────────

const VOUCHER_KEY = 'voucher-pool-testnet4'
const GITMARKS_KEY = 'gitmarks-tbtc4'

function loadVouchers() {
  try { return JSON.parse(localStorage.getItem(VOUCHER_KEY) || '[]') } catch { return [] }
}

function saveVouchers() {
  try { localStorage.setItem(VOUCHER_KEY, JSON.stringify(vouchers)) } catch {}
}

function loadGitmarks() {
  try { return JSON.parse(localStorage.getItem(GITMARKS_KEY) || '[]') } catch { return [] }
}

function saveGitmarks() {
  try { localStorage.setItem(GITMARKS_KEY, JSON.stringify(gitmarks)) } catch {}
}

// ── State ───────────────────────────────────────────────

let vouchers = []
let importing = false
let refreshing = false

let gitmarks = []
let ghCommits = []
let ghLoading = false

// ── Helpers ─────────────────────────────────────────────

function truncate(s, start = 8, end = 6) {
  if (!s || s.length <= start + end + 3) return s
  return s.slice(0, start) + '...' + s.slice(-end)
}

function maskKey(wif) {
  if (!wif || wif.length < 6) return '***'
  return wif.slice(0, 3) + '...' + wif.slice(-3)
}

function satsBtc(sats) { return (sats / 1e8).toFixed(8) }

function toSats(amount) {
  if (!amount) return 0
  if (Number.isInteger(amount) && amount >= 1) return amount
  const converted = Math.round(amount * 1e8)
  if (converted > 2_100_000_000_000_000) return Math.round(amount)
  return converted
}

function escHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
}

function toast(msg) {
  const t = document.createElement('div')
  t.className = 'v-toast'
  t.textContent = msg
  document.body.appendChild(t)
  setTimeout(() => t.remove(), 2000)
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard'))
}

function buildTxoUri(v) {
  const base = `txo:btc:${v.txid}:${v.vout}`
  const params = []
  if (v.amount) params.push(`amount=${v.amount}`)
  if (v.privkey) params.push(`key=${v.privkey}`)
  return params.length ? `${base}?${params.join('&')}` : base
}

// ── Gitmark: Key chaining (BIP-341 TapTweak) ────────────
// Per gitmark spec: scalar uses raw commit hash bytes directly
// (no sha256 wrapper — commit hash IS already a hash)

async function gmScalar(pubkeyCompressed, commitHashHex) {
  const xOnly = pubkeyCompressed.slice(1)
  const commitBytes = hexToU8(commitHashHex)
  return bytesToBigInt(await taggedHash('TapTweak', xOnly, commitBytes)) % SECP_N
}

async function gmDeriveChainedPubkey(pubkeyBase, commitHashes) {
  let P = secp256k1.ProjectivePoint.fromHex(bytesToHex(pubkeyBase))
  let cur = pubkeyBase
  for (const h of commitHashes) {
    const t = await gmScalar(cur, h)
    P = P.add(secp256k1.ProjectivePoint.BASE.multiply(t))
    cur = P.toRawBytes(true)
  }
  return cur
}

async function gmDeriveChainedPrivkey(privkeyBytes, commitHashes) {
  let d = bytesToBigInt(privkeyBytes)
  let cur = secp256k1.getPublicKey(privkeyBytes, true)
  for (const h of commitHashes) {
    const t = await gmScalar(cur, h)
    d = (d + t) % SECP_N
    cur = secp256k1.ProjectivePoint.BASE.multiply(d).toRawBytes(true)
  }
  return bigIntToBytes(d)
}

function gmXonly(pubkeyCompressed) { return pubkeyCompressed.slice(1) }

async function gmAddress(pubkeyBase, commitHashes) {
  const P = await gmDeriveChainedPubkey(pubkeyBase, commitHashes)
  return bech32mEncode('tb', 1, gmXonly(P))
}

async function gmXonlyHex(pubkeyBase, commitHashes) {
  const P = await gmDeriveChainedPubkey(pubkeyBase, commitHashes)
  return bytesToHex(gmXonly(P))
}

// ── GitHub API ──────────────────────────────────────────

async function fetchGitHubCommits(repo) {
  const res = await fetch(`https://api.github.com/repos/${repo}/commits?per_page=20`)
  if (!res.ok) throw new Error('GitHub API: ' + res.status)
  const data = await res.json()
  return data.map(c => ({
    sha: c.sha,
    message: c.commit?.message?.split('\n')[0] || '',
    date: c.commit?.author?.date || '',
    author: c.commit?.author?.name || ''
  }))
}

// ── Import voucher ──────────────────────────────────────

async function importKey(input) {
  input = input.trim()
  if (!input) return

  if (input.startsWith('txo:') || isValidTxoUri(input)) {
    try {
      const parsed = parseTxoUri(input)
      const exists = vouchers.some(v => v.txid === parsed.txid && v.vout === parsed.output)
      if (exists) { toast('Voucher already in pool'); return }
      const v = {
        id: Date.now().toString(36),
        txid: parsed.txid, vout: parsed.output,
        amount: toSats(parsed.amount), privkey: parsed.privkey || '',
        address: '', network: 'btc', status: 'unknown',
        dateAdded: new Date().toISOString()
      }
      if (v.privkey) {
        try {
          const decoded = await decodeKey(v.privkey)
          v.address = privkeyToAddress(decoded.privkey, decoded.testnet)
        } catch {}
      }
      vouchers.unshift(v)
      saveVouchers()
      toast('Voucher imported')
      render()
      refreshStatus(vouchers.indexOf(v))
      return
    } catch (e) {
      console.warn('TXO parse failed, trying as WIF:', e)
    }
  }

  try {
    const decoded = await decodeKey(input)
    const address = privkeyToAddress(decoded.privkey, decoded.testnet)
    toast('Looking up UTXOs...')
    const utxos = await fetchUtxos(address)
    if (utxos.length === 0) { toast('No UTXOs found for this key'); return }
    let added = 0
    for (const u of utxos) {
      const exists = vouchers.some(v => v.txid === u.txid && v.vout === u.vout)
      if (exists) continue
      vouchers.unshift({
        id: Date.now().toString(36) + added,
        txid: u.txid, vout: u.vout, amount: u.value,
        privkey: input, address, network: 'btc',
        status: u.status?.confirmed ? 'unspent' : 'unconfirmed',
        dateAdded: new Date().toISOString()
      })
      added++
    }
    if (added === 0) toast('All UTXOs already in pool')
    else { saveVouchers(); toast(`Imported ${added} voucher${added > 1 ? 's' : ''}`) }
    render()
  } catch (e) {
    toast('Import failed: ' + e.message)
    console.error(e)
  }
}

// ── Refresh status ──────────────────────────────────────

async function refreshStatus(index) {
  if (index !== undefined) {
    const v = vouchers[index]
    if (!v) return
    const result = await checkOutspend(v.txid, v.vout)
    if (result) { v.status = result.spent ? 'spent' : 'unspent'; saveVouchers(); render() }
    return
  }
  refreshing = true; render()
  for (let i = 0; i < vouchers.length; i++) {
    try {
      const result = await checkOutspend(vouchers[i].txid, vouchers[i].vout)
      if (result) vouchers[i].status = result.spent ? 'spent' : 'unspent'
    } catch {}
  }
  saveVouchers(); refreshing = false; render()
}

// ── Delete ──────────────────────────────────────────────

async function deleteVoucher(id) {
  vouchers = vouchers.filter(v => v.id !== id)
  saveVouchers(); render()
}

// ── Gitmark operations ──────────────────────────────────

async function createGitmark(voucherId, commitHash, repo) {
  const v = vouchers.find(x => x.id === voucherId)
  if (!v?.privkey || v.status !== 'unspent') { toast('Need unspent voucher with key'); return }
  if (!isCommitHash(commitHash)) { toast('Invalid commit hash (need 40-char hex)'); return }

  const decoded = await decodeKey(v.privkey)
  const pubkeyBase = secp256k1.getPublicKey(decoded.privkey, true)
  const genesisP = await gmDeriveChainedPubkey(pubkeyBase, [commitHash])
  const genesisXonly = gmXonly(genesisP)
  const genesisScript = p2trScript(genesisXonly)
  const genesisAddr = bech32mEncode('tb', 1, genesisXonly)

  const txDetails = await fetchTxDetails(v.txid)
  const prevOut = txDetails.vout[v.vout]
  if (!prevOut) { toast('Could not find UTXO output'); return }
  const scriptPubKey = hexToU8(prevOut.scriptpubkey)

  const feeRate = await getFeeRate()
  const vsize = estimateVsize(1, 1)
  const fee = Math.ceil(vsize * feeRate)
  const outputAmount = v.amount - fee
  if (outputAmount <= 546) { toast('Not enough funds for fee'); return }

  if (!confirm(`Anchor commit ${commitHash.slice(0, 8)}...?\n\nSpend ${v.amount.toLocaleString()} sats voucher\n\u2192 ${genesisAddr}\nOutput: ${outputAmount.toLocaleString()} sats\nFee: ${fee} sats (${feeRate} sat/vB)`)) return

  toast('Building genesis transaction...')
  const rawTx = await buildTransaction(
    [{ txid: v.txid, vout: v.vout, amount: v.amount, scriptPubKey }],
    [{ amount: outputAmount, scriptPubKey: genesisScript }],
    decoded.privkey
  )
  const newTxid = await broadcastTx(rawTx)
  toast('Genesis broadcast! ' + truncate(newTxid))

  v.status = 'spent'
  saveVouchers()

  gitmarks.unshift({
    id: Date.now().toString(36),
    privkey: v.privkey,
    pubkeyBase: bytesToHex(pubkeyBase),
    repo: repo || '',
    commits: [commitHash],
    network: 'tbtc4',
    currentTxid: newTxid,
    currentVout: 0,
    currentAmount: outputAmount,
    dateCreated: new Date().toISOString()
  })
  saveGitmarks(); render()
}

async function markCommit(gitmarkId, commitHash) {
  const gm = gitmarks.find(g => g.id === gitmarkId)
  if (!gm) return
  if (!isCommitHash(commitHash)) { toast('Invalid commit hash'); return }
  if (gm.commits.includes(commitHash)) { toast('Commit already marked'); return }

  const decoded = await decodeKey(gm.privkey)
  const pubkeyBase = hexToU8(gm.pubkeyBase)
  const currentPrivkey = await gmDeriveChainedPrivkey(decoded.privkey, gm.commits)

  const allCommits = [...gm.commits, commitHash]
  const newP = await gmDeriveChainedPubkey(pubkeyBase, allCommits)
  const newXonly = gmXonly(newP)
  const newScript = p2trScript(newXonly)
  const newAddr = bech32mEncode('tb', 1, newXonly)

  const txDetails = await fetchTxDetails(gm.currentTxid)
  const prevOut = txDetails.vout[gm.currentVout]
  if (!prevOut) { toast('Could not find current UTXO'); return }
  const scriptPubKey = hexToU8(prevOut.scriptpubkey)

  const feeRate = await getFeeRate()
  const vsize = estimateVsize(1, 1)
  const fee = Math.ceil(vsize * feeRate)
  const outputAmount = gm.currentAmount - fee
  if (outputAmount <= 546) { toast('Not enough funds for fee'); return }

  if (!confirm(`Mark commit ${commitHash.slice(0, 8)}...?\n\n\u2192 ${newAddr}\nOutput: ${outputAmount.toLocaleString()} sats\nFee: ${fee} sats (${feeRate} sat/vB)`)) return

  toast('Building transaction...')
  const rawTx = await buildTransaction(
    [{ txid: gm.currentTxid, vout: gm.currentVout, amount: gm.currentAmount, scriptPubKey }],
    [{ amount: outputAmount, scriptPubKey: newScript }],
    currentPrivkey
  )
  const newTxid = await broadcastTx(rawTx)
  toast('Marked! ' + truncate(newTxid))

  gm.commits.push(commitHash)
  gm.currentTxid = newTxid
  gm.currentVout = 0
  gm.currentAmount = outputAmount
  saveGitmarks(); render()
}

async function deleteGitmark(id) {
  gitmarks = gitmarks.filter(g => g.id !== id)
  saveGitmarks(); render()
}

// ── Export .well-known/txo/txo.json ─────────────────────

async function exportTxoJson(gm) {
  const pubkeyBase = hexToU8(gm.pubkeyBase)
  const uris = []
  for (let i = 0; i < gm.commits.length; i++) {
    const xonly = await gmXonlyHex(pubkeyBase, gm.commits.slice(0, i + 1))
    const commit = gm.commits[i]
    const params = [`amount=${gm.currentAmount}`, `pubkey=${xonly}`]
    if (i > 0) params.push(`commit=${commit}`)
    uris.push(`txo:tbtc4:${gm.currentTxid}:${gm.currentVout}?${params.join('&')}`)
  }
  return JSON.stringify(uris, null, 2)
}

function bindEvents() {
  const importBtn = document.getElementById('v-import-btn')
  const importInput = document.getElementById('v-import-input')
  if (importBtn && importInput) {
    const doImport = async () => {
      if (importing) return
      importing = true; render()
      await importKey(importInput.value)
      importing = false; render()
    }
    importBtn.addEventListener('click', doImport)
    importInput.addEventListener('keydown', e => { if (e.key === 'Enter') doImport() })
    importInput.addEventListener('input', () => { if (isHexKey(importInput.value.trim())) doImport() })
  }

  document.getElementById('v-refresh-btn')?.addEventListener('click', () => refreshStatus())
  document.getElementById('v-clear-btn')?.addEventListener('click', () => {
    if (!confirm('Delete all vouchers?')) return
    vouchers = []; saveVouchers(); render()
  })

  document.querySelectorAll('[data-action="delete"]').forEach(btn => {
    btn.addEventListener('click', () => deleteVoucher(btn.dataset.id))
  })

  document.querySelectorAll('[data-action="copy-raw"]').forEach(el => {
    el.addEventListener('click', () => copyText(el.dataset.val))
  })

  document.querySelectorAll('[data-action="reveal"]').forEach(el => {
    el.addEventListener('click', () => {
      if (el.classList.contains('v-masked')) { el.textContent = el.dataset.full; el.classList.remove('v-masked') }
      else { el.textContent = maskKey(el.dataset.full); el.classList.add('v-masked') }
    })
  })

  // ── Gitmark events ──

  document.getElementById('gm-new-toggle')?.addEventListener('click', () => {
    const form = document.getElementById('gm-new-form')
    if (form) form.style.display = form.style.display === 'none' ? 'block' : 'none'
  })
  document.getElementById('gm-cancel-new')?.addEventListener('click', () => {
    const form = document.getElementById('gm-new-form')
    if (form) form.style.display = 'none'
  })

  document.getElementById('gm-fetch-btn')?.addEventListener('click', async () => {
    const repo = document.getElementById('gm-repo')?.value?.trim()
    if (!repo) { toast('Enter a GitHub repo (owner/repo)'); return }
    ghLoading = true; render()
    try {
      ghCommits = await fetchGitHubCommits(repo)
      toast(`Fetched ${ghCommits.length} commits`)
    } catch (e) { toast('Fetch failed: ' + e.message); console.error(e) }
    ghLoading = false; render()
  })

  document.querySelectorAll('#gm-commit-list .gm-commit-item').forEach(el => {
    el.addEventListener('click', () => {
      const input = document.getElementById('gm-commit-hash')
      if (input) input.value = el.dataset.sha
      document.querySelectorAll('#gm-commit-list .gm-commit-item').forEach(x => x.classList.remove('selected'))
      el.classList.add('selected')
    })
  })

  document.getElementById('gm-create-btn')?.addEventListener('click', async () => {
    const select = document.getElementById('gm-voucher-select')
    const commitHash = document.getElementById('gm-commit-hash')?.value?.trim()?.toLowerCase()
    const repo = document.getElementById('gm-repo')?.value?.trim()
    if (!select?.value || !commitHash) { toast('Select voucher and enter commit hash'); return }
    try { await createGitmark(select.value, commitHash, repo) }
    catch (e) { toast('Create failed: ' + e.message); console.error(e) }
  })

  document.getElementById('gm-clear-all')?.addEventListener('click', () => {
    if (!confirm('Delete all gitmarks?')) return
    gitmarks = []; saveGitmarks(); render()
  })

  // Mark
  document.querySelectorAll('[data-action="gm-mark"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const form = btn.closest('.v-item')?.querySelector('.gm-mark-form')
      if (form) form.style.display = form.style.display === 'none' ? 'block' : 'none'
    })
  })
  document.querySelectorAll('[data-action="gm-cancel-mark"]').forEach(btn => {
    btn.addEventListener('click', () => { btn.closest('.gm-mark-form').style.display = 'none' })
  })

  document.querySelectorAll('[data-action="gm-fetch-for"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const gm = gitmarks.find(g => g.id === btn.dataset.id)
      if (!gm?.repo) return
      btn.textContent = 'Fetching...'
      try {
        const commits = await fetchGitHubCommits(gm.repo)
        const list = document.querySelector(`[data-mark-list="${gm.id}"]`)
        if (list) {
          list.innerHTML = commits.filter(c => !gm.commits.includes(c.sha)).map(c => `
            <div class="gm-commit-item" data-sha="${c.sha}" data-mark-pick="${gm.id}">
              <span class="gm-commit-hash">${c.sha.slice(0, 7)}</span>
              <span class="gm-commit-msg">${escHtml(c.message)}</span>
              <span class="gm-commit-date">${c.date ? new Date(c.date).toLocaleDateString() : ''}</span>
            </div>
          `).join('')
          list.querySelectorAll('[data-mark-pick]').forEach(el => {
            el.addEventListener('click', () => {
              const input = document.querySelector(`[data-mark-input="${gm.id}"]`)
              if (input) input.value = el.dataset.sha
              list.querySelectorAll('.gm-commit-item').forEach(x => x.classList.remove('selected'))
              el.classList.add('selected')
            })
          })
        }
        toast(`Fetched ${commits.length} commits`)
      } catch (e) { toast('Fetch failed: ' + e.message) }
      btn.textContent = `Fetch from ${gm.repo}`
    })
  })

  document.querySelectorAll('[data-action="gm-confirm-mark"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.dataset.id
      const input = document.querySelector(`[data-mark-input="${id}"]`)
      const hash = input?.value?.trim()?.toLowerCase()
      if (!hash) { toast('Enter a commit hash'); return }
      try { await markCommit(id, hash) }
      catch (e) { toast('Mark failed: ' + e.message); console.error(e) }
    })
  })

  // Verify
  document.querySelectorAll('[data-action="gm-verify"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const gm = gitmarks.find(g => g.id === btn.dataset.id)
      if (!gm) return
      const panel = document.querySelector(`[data-gm-verify="${gm.id}"]`)
      if (!panel) return
      if (panel.style.display !== 'none') { panel.style.display = 'none'; return }
      panel.style.display = 'block'
      panel.innerHTML = '<div style="color:rgba(255,255,255,0.3);font-size:0.8rem"><span class="v-spinner"></span> Computing chain...</div>'
      try {
        const pubkeyBase = hexToU8(gm.pubkeyBase)
        let h = '<ul class="bt-chain">'
        for (let i = 0; i < gm.commits.length; i++) {
          const cur = i === gm.commits.length - 1
          const addr = await gmAddress(pubkeyBase, gm.commits.slice(0, i + 1))
          const commitShort = gm.commits[i].slice(0, 7)
          const ghLink = gm.repo ? ` <a href="https://github.com/${escHtml(gm.repo)}/commit/${gm.commits[i]}" target="_blank" rel="noopener" style="color:rgba(245,158,11,0.6);text-decoration:none;font-size:0.72rem">\u2197</a>` : ''
          h += `<li class="bt-step ${cur ? 'bt-step-current' : ''}">
            <span class="bt-step-num">${i}</span>
            <div class="bt-step-info">
              <div class="bt-step-state" style="font-family:'SF Mono',monospace;font-size:0.8rem;color:rgba(245,158,11,0.8)">${gm.commits[i]}${ghLink}</div>
              <div class="bt-step-addr" data-action="copy-raw" data-val="${addr}">${addr}</div>
            </div>
          </li>`
        }
        h += '</ul>'
        h += `<div style="margin-top:8px;font-size:0.75rem;color:rgba(16,185,129,0.7)">Chain verified: ${gm.commits.length} commit${gm.commits.length > 1 ? 's' : ''}, pubkey ${truncate(gm.pubkeyBase)}</div>`
        panel.innerHTML = h
        panel.querySelectorAll('[data-action="copy-raw"]').forEach(el => {
          el.addEventListener('click', () => copyText(el.dataset.val))
        })
      } catch (e) {
        panel.innerHTML = `<div style="color:#ef4444;font-size:0.8rem">Verify failed: ${escHtml(e.message)}</div>`
      }
    })
  })

  // Export
  document.querySelectorAll('[data-action="gm-export"]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const gm = gitmarks.find(g => g.id === btn.dataset.id)
      if (!gm) return
      const panel = document.querySelector(`[data-gm-export="${gm.id}"]`)
      if (!panel) return
      if (panel.style.display !== 'none') { panel.style.display = 'none'; return }
      panel.style.display = 'block'
      panel.innerHTML = '<div style="color:rgba(255,255,255,0.3);font-size:0.8rem"><span class="v-spinner"></span> Generating...</div>'
      try {
        const json = await exportTxoJson(gm)
        panel.innerHTML = `
          <div style="font-size:0.72rem;color:rgba(255,255,255,0.3);margin-bottom:4px">.well-known/txo/txo.json</div>
          <pre style="background:rgba(0,0,0,0.3);padding:12px;border-radius:8px;font-size:0.75rem;color:rgba(255,255,255,0.7);overflow-x:auto;white-space:pre-wrap;word-break:break-all;cursor:pointer" data-action="copy-raw" data-val='${escHtml(json)}'>${escHtml(json)}</pre>
          <div style="font-size:0.7rem;color:rgba(255,255,255,0.25);margin-top:4px">Click to copy</div>
        `
        panel.querySelector('[data-action="copy-raw"]')?.addEventListener('click', () => copyText(json))
      } catch (e) {
        panel.innerHTML = `<div style="color:#ef4444;font-size:0.8rem">Export failed: ${escHtml(e.message)}</div>`
      }
    })
  })

  // Delete gitmark
  document.querySelectorAll('[data-action="gm-delete"]').forEach(btn => {
    btn.addEventListener('click', () => deleteGitmark(btn.dataset.id))
  })
}

// ── Init ────────────────────────────────────────────────

async function init() {
  const params = new URLSearchParams(location.search)
  const keyParam = params.get('key')

  vouchers = loadVouchers()
  gitmarks = loadGitmarks()

  render()

  if (keyParam) {
    history.replaceState({}, '', location.pathname)
    importing = true; render()
    await importKey(keyParam)
    importing = false; render()
  }

  if (vouchers.length > 0) refreshStatus()
}

init()
  </script>
</body>
</html>
